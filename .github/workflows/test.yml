name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bats:
    name: Shell scripts (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run tests
        run: tests/run.sh

  extension:
    name: Extension (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: bun test
