# @decision(DL-005) @decision(DL-013) @decision(DL-020)
name: Tests

on:
  pull_request:
  push:
    branches: [main, v1]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, unit tests, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Biome
        run: npx biome ci .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Package contents
        run: npm run check:pack

  coverage:
    name: Unit test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Coverage (fails below the floor)
        run: npm run test:coverage
      - name: Coverage on the base commit
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          if [ -f bunfig.toml ]; then
            bun install --frozen-lockfile
            bun test --coverage src || true
          fi
      - name: Render report
        if: "!cancelled()"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          [ -f coverage/lcov.info ] || { echo "No coverage produced." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node scripts/coverage-report.mjs --head coverage/lcov.info \
            --base "$RUNNER_TEMP/base/coverage/lcov.info" --base-label "\`${BASE_REF:-base}\`" \
            > coverage/report.md
          cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the PR
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            if (!fs.existsSync("coverage/report.md")) return;
            const body = fs.readFileSync("coverage/report.md", "utf8");
            const marker = "<!-- dld-coverage-report -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cli:
    name: CLI integration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Build and test under node
        run: npm run test:cli

  bats:
    name: bats (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [scripts, cli]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run against the shell scripts
        if: matrix.target == 'scripts'
        run: npm run test:bats
      - uses: actions/setup-node@v4
        if: matrix.target == 'cli'
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        if: matrix.target == 'cli'
        with:
          bun-version: 1.3.11
      - if: matrix.target == 'cli'
        run: bun install --frozen-lockfile
      - name: Run against the dld CLI
        if: matrix.target == 'cli'
        run: npm run test:bats:cli
